<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Oferta exclusiva — Masterclass do Nervo Vago</title>
<style>
  :root{
    --ink:#20302b; --muted:#5c6b63; --cream:#f6f3ec; --card:#ffffff;
    --green:#2f6f57; --green-d:#245743; --gold:#b8893b; --line:#e3ded3; --alert:#b4452f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px 60px}
  .bar{background:var(--alert);color:#fff;text-align:center;font-weight:700;font-size:14px;letter-spacing:.3px;padding:10px 14px}
  .hook{text-align:center;padding:30px 6px 14px}
  .hook h1{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
  .hook h1 .hl{color:var(--gold)}
  .vsl{margin:20px auto 6px;max-width:640px}
  .vsl .frame{position:relative;width:100%;aspect-ratio:16/9;background:#10201b;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
  .vsl .frame .ph{color:#cfe0d6;text-align:center;font-size:14px;padding:20px}
  .vsl .frame .play{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
  .vsl .frame .play:after{content:"";border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:6px}
  .note{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
  @media(max-width:520px){.hook h1{font-size:25px}}
</style>
</head>
<body>
  <div class="bar">⚠️ ESTA PÁGINA ABRE UMA VEZ SÓ — NÃO FECHE</div>
  <div class="wrap">

    <div class="hook">
      <h1>VOCÊ PODE TER O <span class="hl">BARALHO IMPRESSO</span> AINDA ESSA SEMANA 📦</h1>
    </div>

    <!-- ======= VSL UPSELL ======= -->
    <div class="vsl">
      <div class="frame" id="vsl-upsell">
        <!-- COLE AQUI O EMBED DO PLAYER (VTurb) DO UPSELL. O botão de compra e o de recusa são liberados no pitch pelo próprio VTurb. -->
        <div class="ph"><div class="play"></div>VSL do Upsell<br>(cole o embed do player aqui)</div>
      </div>
      <p class="note">▶ Aumente o som. O vídeo começa automaticamente.</p>
    </div>

  </div>
</body>
</html>
